<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Apex Academy</title>
  <meta name="description" content="Apex Academy Administrative Management Portal for Admissions and Counselling.">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="shortcut icon" href="../assets/images/favicon.ico">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Sidebar Mobile Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-layout">
    <!-- ─── SIDEBAR NAVIGATION ─── -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="sidebar-logo" aria-label="Apex Academy Dashboard">
          <img src="../assets/images/apex-logo-clean.png" alt="Apex Academy Logo">
          <div class="sidebar-logo-text">
            <span class="brand-name">APEX <span style="color:#D97706;">ACADEMY</span></span>
            <span class="brand-sub">Administration Desk</span>
          </div>
        </a>
        <div class="sidebar-role-badge" id="sidebarRoleBadge">
          <span class="dot"></span>
          <span id="sidebarRoleLabel">Super Admin</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav" aria-label="Main Navigation">
        <!-- Dynamically populated according to active role by admin.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebarUserProfile" title="Current Authenticated User">
          <div class="sidebar-user-avatar" id="userAvatar">RS</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="userName">Dr. Rajesh Sharma</div>
            <div class="sidebar-user-role" id="userRole">Super Admin</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ─── MAIN CONTENT VIEWPORT ─── -->
    <main class="admin-main">
      <!-- Top Bar Header -->
      <header class="admin-topbar">
        <button class="topbar-menu-btn" id="menuToggle" aria-label="Toggle navigation menu">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div>
          <h1 class="topbar-title" id="pageTitle">Overview</h1>
          <div class="topbar-breadcrumb">
            <span>Portal</span>
            <span class="sep">/</span>
            <span id="pageBreadcrumb">Overview</span>
          </div>
        </div>

        <div class="topbar-actions">
          <!-- In-App Notification Center -->
          <div class="topbar-notif-container" style="position:relative;">
            <button id="notifBellBtn" class="btn btn-xs btn-outline" title="Notifications" aria-label="View notifications">
              <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
              <span id="notifBadge" class="notif-badge" style="display:none;">0</span>
            </button>
            <div class="notif-dropdown" id="notifDropdown" style="display:none;">
              <div class="notif-dropdown-header">
                <span style="font-weight:700; font-size:0.8125rem; color:#0F172A;">Notifications</span>
                <button type="button" id="markAllReadBtn" style="font-size:0.6875rem; color:#1E3A8A; background:none; border:none; cursor:pointer; font-weight:600;">Mark all read</button>
              </div>
              <div class="notif-dropdown-list" id="notifList">
                <div style="padding:1rem; text-align:center; color:#94A3B8; font-size:0.75rem;">No unread notifications</div>
              </div>
            </div>
          </div>

          <!-- Interactive Guided Tour Button -->
          <button id="startTourBtn" class="btn btn-xs btn-outline" title="Interactive Guided Tour for your workspace">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="hide-mobile">Guided Tour</span>
          </button>

          <!-- Reset Demo Store -->
          <button id="resetDemoBtn" class="btn btn-xs btn-outline hide-mobile" title="Reset sample records to initial state">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span>Reset Demo</span>
          </button>

          <!-- External Link to Public Website -->
          <a href="../index.html" target="_blank" rel="noopener noreferrer" class="btn btn-xs btn-outline" title="View Public Website">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            <span class="hide-mobile">Public Site</span>
          </a>

          <!-- Direct Sign Out Button -->
          <button id="topbarLogoutBtn" class="btn btn-xs btn-outline" title="Sign out of portal" style="color:#DC2626; border-color:#FECACA;">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span class="hide-mobile">Logout</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Content Injection Container -->
      <div class="admin-content" id="pageContent">
        <!-- Rendered by admin.js based on role and active tab -->
        <div style="padding:3rem; text-align:center; color:#94A3B8;">
          <div class="skeleton" style="width:200px; height:24px; margin:0 auto 1rem;"></div>
          <div class="skeleton" style="width:300px; height:16px; margin:0 auto 0.5rem;"></div>
          <div class="skeleton" style="width:250px; height:16px; margin:0 auto;"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ─── INTERACTIVE ONBOARDING GUIDED TOUR OVERLAY ─── -->
  <div class="tour-backdrop" id="tourBackdrop" style="display:none;"></div>
  <div class="tour-spotlight" id="tourSpotlight" style="display:none;"></div>
  <div class="tour-popover" id="tourPopover" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
    <div class="tour-popover-header">
      <span class="tour-step-badge" id="tourStepBadge">Step 1 of 8</span>
      <button class="tour-close-btn" id="tourSkipBtn" title="Close and skip tour" aria-label="Skip tour">&times;</button>
    </div>
    <h4 class="tour-title" id="tourTitle">Feature Name</h4>
    <p class="tour-desc" id="tourDesc">Description of this portal capability and how it supports your daily tasks.</p>
    <div class="tour-footer">
      <div class="tour-dots" id="tourDots"></div>
      <div class="tour-actions">
        <button class="btn btn-xs btn-secondary" id="tourPrevBtn">Previous</button>
        <button class="btn btn-xs btn-primary" id="tourNextBtn">Next</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div class="admin-toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Reusable Centered Modal Dialog -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <!-- Reusable Right Side Detail Drawer -->
  <div class="sidebar-overlay" id="drawerOverlay" style="z-index:45;"></div>
  <aside class="detail-drawer" id="detailDrawer" aria-label="Item detail drawer">
    <div class="drawer-header">
      <h3 class="modal-title" id="drawerTitle">Record Details</h3>
      <button class="modal-close" id="drawerClose" aria-label="Close drawer">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer" id="drawerFooter"></div>
  </aside>

  <!-- Load Data Layer First, Then Controller -->
  <!-- Supabase CDN & Backend Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
